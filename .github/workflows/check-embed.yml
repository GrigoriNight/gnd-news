name: Check launcher embed

on:
  push:
    paths:
      - Launcher.godaddy.html
      - tools/check_embed.py
      - .github/workflows/check-embed.yml
  pull_request:
    paths:
      - Launcher.godaddy.html
      - tools/check_embed.py
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_embed.py
